name: Goodreads check

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 min (GitHub often runs scheduled jobs a few minutes late)
  workflow_dispatch:         # lets you run it by hand from the Actions tab
    inputs:
      dry_run:
        description: "Dry run: check the pages but don't send email or save anything"
        type: boolean
        default: false

permissions:
  contents: write            # only for the heartbeat commit below

concurrency:
  group: goodreads-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # state.json (what's already been emailed) lives in the Actions cache, not
      # in the repo, so her book titles never appear in this public repository.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Remember state before the check
        run: echo "STATE_BEFORE=$(sha256sum state.json 2>/dev/null | cut -c1-64)" >> "$GITHUB_ENV"

      - name: Check for new activity
        env:
          FRIEND_NAME: ${{ secrets.FRIEND_NAME }}
          PROFILE_URL: ${{ secrets.PROFILE_URL }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: python check.py

      - name: Did state change?
        id: state
        run: |
          after=$(sha256sum state.json 2>/dev/null | cut -c1-64)
          if [ -n "$after" ] && [ "$after" != "$STATE_BEFORE" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save state
        if: steps.state.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}-${{ github.run_attempt }}

      # GitHub pauses schedules in public repos after 60 days without a commit.
      # This commits a date (and nothing else) to heartbeat.txt every ~20 days.
      - name: Heartbeat
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 20 * 86400 )) ]; then
            date -u +%F > heartbeat.txt
            git config user.name "goodreads-check"
            git config user.email "actions@users.noreply.github.com"
            git add heartbeat.txt
            git commit -m "Heartbeat"
            git push
          fi
